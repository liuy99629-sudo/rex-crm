apiVersion: v1
kind: ConfigMap
metadata:
  name: rex-crm-config
data:
  APP_NAME: "Rex CRM"
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: rexcrm
  DB_USERNAME: rexcrm
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: array
