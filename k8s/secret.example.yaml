# NOT part of kustomization.yaml. Create the real secret once, outside git:
#
#   kubectl -n rex-crm create secret generic rex-crm-secrets \
#     --from-literal=APP_KEY="$(php -r 'echo "base64:".base64_encode(random_bytes(32));')" \
#     --from-literal=DB_PASSWORD="<strong password>"
#
apiVersion: v1
kind: Secret
metadata:
  name: rex-crm-secrets
type: Opaque
stringData:
  APP_KEY: "base64:CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
