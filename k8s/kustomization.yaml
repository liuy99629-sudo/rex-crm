apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rex-crm
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - ingress.yaml
# CI replaces these with the real Artifact Registry paths and the commit SHA (see .github/workflows/ci.yml).
images:
  - name: rex-crm-api
    newName: REGION-docker.pkg.dev/PROJECT_ID/rex-crm/api
    newTag: latest
  - name: rex-crm-web
    newName: REGION-docker.pkg.dev/PROJECT_ID/rex-crm/web
    newTag: latest
