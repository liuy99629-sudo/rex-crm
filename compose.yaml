# Rex CRM local stack:  docker compose up --build
#   web    -> http://localhost:8080   (React, proxies /api to the API)
#   api    -> http://localhost:8000   (Laravel, direct access for curl / Postman)
#   ai     -> http://localhost:8001   (AI assistant, docs at /api/ai/docs)
name: rex-crm

x-api-env: &api-env
  APP_NAME: "Rex CRM"
  APP_ENV: local
  APP_DEBUG: "true"
  # Development-only key. Generate your own for anything shared: docker compose run --rm api php artisan key:generate --show
  APP_KEY: ${APP_KEY:-base64:wqhgINpZ/C4hO71TS3sU7FXPIJKloCDVW8hps8FiJlc=}
  APP_URL: http://localhost:8080
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: rexcrm
  DB_USERNAME: rexcrm
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: array

services:
  postgres:
    # PostgreSQL 16 + the pgvector extension (vector search for the AI assistant).
    # Switching an existing volume from postgres:16-alpine: run once
    #   docker compose exec postgres psql -U rexcrm -d rexcrm -c "REINDEX DATABASE rexcrm"
    # (alpine uses musl, this image uses glibc, and text index ordering can differ).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rexcrm
      POSTGRES_USER: rexcrm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rexcrm -d rexcrm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      # Without a target Docker builds the last stage (test), which runs the test suite instead of serving.
      target: app
    image: rex-crm-api:local
    environment:
      <<: *api-env
      # Run migrations on start (isolated = safe with several replicas).
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION_ISOLATED: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "false"
    ports:
      - "8000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/api/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Same image as the API, different command: this is the "Queue Worker" box in the architecture diagram.
  worker:
    image: rex-crm-api:local
    command: ["php", "/var/www/html/artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600", "-v"]
    environment:
      <<: *api-env
      AUTORUN_ENABLED: "false"
    # The image's built-in healthcheck curls nginx, which does not run in the worker.
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  # Backend test suite (SQLite in memory, needs no other service):  docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test

  # "Ask Rex" AI assistant (Python, FastAPI, LangGraph, Claude, pgvector). Served at /api/ai/*.
  ai:
    build:
      context: ./ai
      target: app
    image: rex-crm-ai:local
    environment:
      DATABASE_URL: postgresql://rexcrm:${DB_PASSWORD:-secret}@postgres:5432/rexcrm
      LARAVEL_URL: http://api:8080
      # Put your key in a .env file next to this one (never commit it). Without it the
      # assistant answers 503 and everything else still works.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      REINDEX_INTERVAL: "300"
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  # AI service tests (need no API key):  docker compose --profile test run --rm ai-test
  # They drop and recreate tables, so they get their own throwaway database, never the CRM one.
  ai-test:
    profiles: ["test"]
    build:
      context: ./ai
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://postgres:test@ai-test-db:5432/aitest
    depends_on:
      ai-test-db:
        condition: service_healthy

  ai-test-db:
    profiles: ["test"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: aitest
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aitest"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    image: rex-crm-web:local
    environment:
      API_UPSTREAM: api:8080
      AI_UPSTREAM: ai:8000
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_started

volumes:
  pgdata:
