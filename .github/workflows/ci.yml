name: CI / CD

# Pull request:  run tests + build check.
# Push to main:  also build images, push to Artifact Registry and deploy to GKE.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # needed for Workload Identity Federation to GCP

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  frontend:
    name: Frontend test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  ai:
    name: AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aitest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d aitest" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/aitest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements*.txt
      # CPU-only torch (sentence-transformers dependency); tests use a fake embedder, no model download.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  mcp:
    name: MCP server test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  portal:
    name: Portal + gateway test + build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [gateway, portal]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  analytics:
    name: Analytics (PySpark) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  lead-pipeline:
    name: Lead pipeline tests + SAM build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lead-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lead-pipeline/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam validate --lint --region ap-southeast-2
      - run: sam build

  # AWS (separate from GKE): deploys the Lambda, S3 bucket, DynamoDB ledger and DLQ with SAM.
  # Skipped until the repository variable AWS_DEPLOY_ROLE_ARN (an IAM role trusted for this repo
  # via GitHub OIDC) and CRM_PUBLIC_API_URL are set.
  deploy-lead-pipeline:
    name: Deploy lead pipeline to AWS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: [lead-pipeline, backend]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: lead-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - run: sam build
      - run: sam deploy --parameter-overrides "CrmApiUrl=${{ vars.CRM_PUBLIC_API_URL }}"

  images:
    name: Build and push images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, ai, mcp, portal, analytics]
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/api:${{ github.sha }}
            ${{ env.REGISTRY }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build and push AI image
        uses: docker/build-push-action@v6
        with:
          context: ai
          target: app
          push: true
          tags: |
            ${{ env.REGISTRY }}/ai:${{ github.sha }}
            ${{ env.REGISTRY }}/ai:latest
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max
      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/gateway:${{ github.sha }}
            ${{ env.REGISTRY }}/gateway:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,scope=gateway,mode=max
      - name: Build and push portal image
        uses: docker/build-push-action@v6
        with:
          context: portal
          push: true
          tags: |
            ${{ env.REGISTRY }}/portal:${{ github.sha }}
            ${{ env.REGISTRY }}/portal:latest
          cache-from: type=gha,scope=portal
          cache-to: type=gha,scope=portal,mode=max
      - name: Build and push analytics image
        uses: docker/build-push-action@v6
        with:
          context: analytics
          target: job
          push: true
          tags: |
            ${{ env.REGISTRY }}/analytics:${{ github.sha }}
            ${{ env.REGISTRY }}/analytics:latest
          cache-from: type=gha,scope=analytics
          cache-to: type=gha,scope=analytics,mode=max

  deploy:
    name: Deploy to GKE
    needs: [images]
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
      - name: Point manifests at this commit's images
        run: |
          sed -i "s#REGION-docker.pkg.dev/PROJECT_ID/rex-crm#${REGISTRY}#g; s#newTag: latest#newTag: ${GITHUB_SHA}#g" k8s/kustomization.yaml
          grep -A1 "name: rex-crm" k8s/kustomization.yaml
      - name: Apply
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -k k8s
      - name: Wait for rollout
        run: |
          kubectl -n rex-crm rollout status deployment/rex-api --timeout=300s
          kubectl -n rex-crm rollout status deployment/rex-worker --timeout=180s
          kubectl -n rex-crm rollout status deployment/rex-web --timeout=180s
          kubectl -n rex-crm rollout status deployment/rex-ai --timeout=300s
          kubectl -n rex-crm rollout status deployment/rex-gateway --timeout=180s
          kubectl -n rex-crm rollout status deployment/rex-portal --timeout=180s
