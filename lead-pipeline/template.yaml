AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rex CRM email lead pipeline. Portal enquiry emails (realestate.com.au, Domain, direct mail) land in
  S3 (via an SES receipt rule), a Lambda extracts the lead with Claude in Amazon Bedrock, records it
  in a DynamoDB ledger (idempotency + audit) and posts it to the CRM as a new lead.

Parameters:
  CrmApiUrl:
    Type: String
    Default: none
    Description: CRM API base URL, e.g. https://crm.example.com/api ("none" = no CRM yet; leads are only extracted and recorded)
  CrmTokenParameterName:
    Type: String
    Default: /rex-crm/lead-pipeline-token
    Description: >
      SSM Parameter Store SecureString holding a token from `php artisan rex:integration-token lead-pipeline`
      (create it once, outside this template).
  Extractor:
    Type: String
    Default: claude
    AllowedValues: [claude, rules]
    Description: claude = Claude in Amazon Bedrock (billed per token); rules = labelled-field parser (free)
  ReservedConcurrency:
    Type: Number
    Default: 0
    Description: Max parallel Lambda runs (0 = no reservation; needs a concurrency quota above 10)
  BedrockModel:
    Type: String
    Default: anthropic.claude-opus-5-5
  BedrockRegion:
    Type: String
    Default: ap-southeast-2
    Description: Region of the bedrock-mantle endpoint (Sydney supports the global endpoint).

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 60
    MemorySize: 512
    Tracing: Active

Resources:
  InboundMailBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Fixed name, so the function's policy can name it without a circular reference to the bucket.
      BucketName: !Sub "rex-inbound-mail-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Raw emails contain personal details: keep them only as long as needed to reprocess.
          - Id: expire-raw-mail
            Status: Enabled
            ExpirationInDays: 30

  InboundMailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref InboundMailBucket
      PolicyDocument:
        Statement:
          # Lets an SES receipt rule in this account store incoming mail under inbox/.
          - Sid: AllowSesPuts
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${InboundMailBucket.Arn}/inbox/*"
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }

  LeadLedger:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: message_id, AttributeType: S }
      KeySchema:
        - { AttributeName: message_id, KeyType: HASH }
      TimeToLiveSpecification: { AttributeName: expires_at, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  LeadDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days to investigate and replay

  LeadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: leads.handler.lambda_handler
      Description: Extract leads from inbound email and post them to Rex CRM
      # Cap parallel runs to be gentle on the CRM and Bedrock quotas. New accounts have only 10
      # concurrent executions in total and must keep 10 unreserved, so it is off unless set.
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      DeadLetterQueue: { Type: SQS, TargetArn: !GetAtt LeadDeadLetterQueue.Arn }
      Environment:
        Variables:
          LEDGER_TABLE: !Ref LeadLedger
          CRM_API_URL: !Ref CrmApiUrl
          CRM_TOKEN_PARAM: !Ref CrmTokenParameterName
          BEDROCK_MODEL: !Ref BedrockModel
          BEDROCK_REGION: !Ref BedrockRegion
          EXTRACTOR: !Ref Extractor
      Policies:
        - S3ReadPolicy: { BucketName: !Sub "rex-inbound-mail-${AWS::AccountId}-${AWS::Region}" }
        - DynamoDBCrudPolicy: { TableName: !Ref LeadLedger }
        - Statement:
            # Read only the CRM token parameter (its name starts with "/", so it follows "parameter" directly).
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CrmTokenParameterName}"
        - Statement:
            # Claude in Amazon Bedrock (bedrock-mantle). Narrow Resource to the model ARNs you enable.
            - Effect: Allow
              Action: bedrock-mantle:CreateInference
              Resource: "*"
      Events:
        InboundMail:
          Type: S3
          Properties:
            Bucket: !Ref InboundMailBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: inbox/ }

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: An inbound email failed after retries; check the ledger and the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt LeadDeadLetterQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  InboundMailBucketName:
    Description: Point the SES receipt rule's S3 action here, with object key prefix "inbox/".
    Value: !Ref InboundMailBucket
  LedgerTableName:
    Value: !Ref LeadLedger
  FunctionName:
    Value: !Ref LeadFunction
  DeadLetterQueueUrl:
    Value: !Ref LeadDeadLetterQueue
